<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Time</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F2EFE9; --surface: #FAFAF7; --surface2: #EAE6DF;
    --text: #2A2420; --muted: #9A948A; --border: rgba(42,36,32,0.1);
    --red: #D94F2A; --red-light: #F5E8E3;
    --mint: #7EB8A4; --mint-light: #E6F2EE;
    --beige: #B5A898; --beige-light: #EDE8E2;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'DM Sans', sans-serif;
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 1.5rem 1rem; }
  .app { width: 100%; max-width: 400px; }

  /* ── 프로필 선택 화면 ── */
  .profile-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
  .profile-title { font-family: var(--serif); font-size: 28px; color: var(--text); margin-bottom: 0.5rem; text-align: center; }
  .profile-sub { font-size: 13px; color: var(--muted); margin-bottom: 3rem; text-align: center; }
  .profile-cards { display: flex; gap: 1.5rem; justify-content: center; }
  .profile-card { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; cursor: pointer; transition: transform 0.2s; }
  .profile-card:hover { transform: translateY(-4px); }
  .profile-avatar { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 32px; font-style: italic; border: 2.5px solid transparent; transition: border-color 0.2s; }
  .profile-avatar.dasol { background: var(--red-light); color: var(--red); }
  .profile-avatar.jimmy { background: var(--mint-light); color: var(--mint); }
  .profile-card:hover .profile-avatar.dasol { border-color: var(--red); }
  .profile-card:hover .profile-avatar.jimmy { border-color: var(--mint); }
  .profile-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .profile-pin-wrap { margin-top: 0.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .profile-pin-label { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
  .pin-dots { display: flex; gap: 8px; }
  .pin-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background 0.15s; }
  .pin-dot.filled.dasol { background: var(--red); }
  .pin-dot.filled.jimmy { background: var(--mint); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 180px; margin-top: 0.5rem; }
  .pin-key { height: 44px; border: 0.5px solid var(--border); border-radius: 10px; background: var(--surface); font-family: var(--sans); font-size: 16px; font-weight: 500; color: var(--text); cursor: pointer; transition: background 0.15s; }
  .pin-key:hover { background: var(--surface2); }
  .pin-key.del { font-size: 13px; color: var(--muted); }
  .pin-error { font-size: 11px; color: var(--red); margin-top: 0.25rem; min-height: 16px; }
  .pin-section { display: none; flex-direction: column; align-items: center; margin-top: 1rem; }
  .pin-section.visible { display: flex; }

  /* ── 메인 앱 ── */
  .main-screen { display: none; }
  .main-screen.visible { display: block; }

  /* 상단 프로필 바 */
  .profile-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .profile-bar-left { display: flex; align-items: center; gap: 10px; }
  .profile-bar-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 14px; font-style: italic; }
  .profile-bar-avatar.dasol { background: var(--red-light); color: var(--red); }
  .profile-bar-avatar.jimmy { background: var(--mint-light); color: var(--mint); }
  .profile-bar-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .profile-bar-sub { font-size: 10px; color: var(--muted); }
  .logout-btn { font-family: var(--sans); font-size: 11px; color: var(--muted); background: none; border: 0.5px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; transition: background 0.15s; }
  .logout-btn:hover { background: var(--surface2); }

  /* 나머지 스타일 */
  .header { text-align: center; margin-bottom: 1.25rem; }
  .app-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
  .couple-line { font-family: var(--serif); font-size: 22px; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .heart-icon { color: var(--red); font-size: 16px; animation: pulse 2.4s ease-in-out infinite; display: inline-block; }
  @keyframes pulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.2);} }
  .dday-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .dday-card { background: var(--red-light); border-radius: 12px; padding: 0.6rem 0.75rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .dday-card-label { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); margin-bottom: 2px; }
  .dday-card-prefix { font-size: 12px; color: var(--red); font-weight: 500; }
  .dday-card-num { font-family: var(--serif); font-size: 28px; color: var(--text); line-height: 1; letter-spacing: -1px; }
  .dday-today { background: var(--beige-light); border-radius: 12px; padding: 0.6rem 0.75rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .dday-today-label { font-size: 9px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2px; }
  .dday-today-val { font-size: 12px; font-weight: 500; color: var(--text); text-align: center; line-height: 1.4; }
  .breakdown-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .bd-card { border-radius: 12px; padding: 0.6rem 0.4rem; text-align: center; }
  .bd-card.y { background: var(--mint-light); } .bd-card.m { background: var(--beige-light); } .bd-card.d { background: var(--red-light); }
  .bd-num { font-family: var(--serif); font-size: 18px; line-height: 1; }
  .bd-card.y .bd-num { color: var(--mint); } .bd-card.m .bd-num { color: var(--beige); } .bd-card.d .bd-num { color: var(--red); }
  .bd-label { font-size: 10px; margin-top: 2px; }
  .bd-card.y .bd-label { color: var(--mint); } .bd-card.m .bd-label { color: var(--beige); } .bd-card.d .bd-label { color: var(--red); }

  .weather-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 0.75rem 1rem; margin-bottom: 1.25rem; }
  .weather-card-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
  .weather-cities { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 0.5rem; }
  .weather-city { background: var(--surface2); border-radius: 10px; padding: 0.5rem 0.75rem; }
  .weather-city-name { font-size: 10px; color: var(--muted); margin-bottom: 2px; }
  .weather-city-row { display: flex; align-items: center; gap: 6px; }
  .weather-icon { font-size: 18px; }
  .weather-temp { font-family: var(--serif); font-size: 20px; color: var(--text); }
  .weather-uv { font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 500; }
  .weather-uv.low { background: #E6F2EE; color: var(--mint); }
  .weather-uv.moderate { background: #FEFAEC; color: #B8960A; }
  .weather-uv.high { background: #FEF0F0; color: var(--red); }
  .weather-uv.very-high { background: #F5E8E3; color: #A03000; }
  .weather-comment { font-size: 11px; color: var(--muted); text-align: center; padding-top: 0.4rem; border-top: 0.5px solid var(--border); margin-top: 0.4rem; }
  .weather-loading { font-size: 12px; color: var(--muted); text-align: center; padding: 0.5rem; }
  .distance-card { border-radius: 12px; padding: 0.7rem 1rem; margin-bottom: 1.25rem; background: var(--surface); border: 0.5px solid var(--border); }
  .distance-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: center; margin-bottom: 0.5rem; }
  .distance-row { display: flex; align-items: center; gap: 0; }
  .distance-house { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
  .distance-house-icon { font-size: 18px; }
  .distance-house-name { font-size: 10px; font-weight: 500; color: var(--text); }
  .distance-line { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .distance-dots { width: 100%; display: flex; align-items: center; gap: 0; }
  .distance-dash { flex: 1; height: 1.5px; background: var(--border); }
  .distance-km { font-size: 11px; font-weight: 500; color: var(--red); background: var(--red-light); padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
  .milestone-card { background: var(--red-light); border-radius: 12px; padding: 0.7rem 1rem; display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .milestone-left { font-size: 12px; color: var(--red); } .milestone-right { font-size: 12px; font-weight: 500; color: var(--red); }
  .divider { height: 0.5px; background: var(--border); margin-bottom: 1.25rem; }
  .section-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }
  .calendar-wrap { margin-bottom: 1.5rem; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
  .cal-title { font-family: var(--serif); font-size: 16px; color: var(--text); }
  .cal-nav { background: none; border: 0.5px solid var(--border); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 13px; color: var(--muted); display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .cal-nav:hover { background: var(--surface2); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { font-size: 10px; color: var(--muted); text-align: center; padding-bottom: 5px; }
  .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 12px; cursor: pointer; transition: background 0.15s; user-select: none; gap: 1px; }
  .cal-day:hover { background: var(--surface2); }
  .cal-day.empty { cursor: default; } .cal-day.empty:hover { background: none; }
  .cal-day.today { font-weight: 500; color: var(--red); }
  .cal-day.has-date { background: var(--red-light); } .cal-day.has-date:hover { background: #ecd8d0; }
  .cal-indicators { display: flex; gap: 2px; align-items: center; justify-content: center; min-height: 10px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--red); }
  .cal-dot.mint { background: var(--mint); }
  .cal-emoji { font-size: 10px; line-height: 1; }
  .day-detail { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; margin-bottom: 0.6rem; padding: 0.875rem 1rem; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .day-detail:hover { background: var(--surface2); }
  .day-detail-left { flex: 1; min-width: 0; }
  .day-detail-date { font-family: var(--serif); font-size: 14px; color: var(--text); margin-bottom: 4px; }
  .day-detail-preview { display: flex; gap: 8px; align-items: center; }
  .day-detail-author-chip { font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
  .day-detail-author-chip.dasol { background: var(--red-light); color: var(--red); }
  .day-detail-author-chip.jimmy { background: var(--mint-light); color: var(--mint); }
  .day-detail-snippet { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
  .day-detail-arrow { font-size: 14px; color: var(--muted); flex-shrink: 0; }
  /* 날짜 팝업 모달 */
  .day-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(42,36,32,0.45); z-index: 105; align-items: center; justify-content: center; padding: 1rem; }
  .day-modal-overlay.open { display: flex; }
  .day-modal { background: var(--surface); border-radius: 20px; width: 100%; max-width: 360px; max-height: 88vh; overflow-y: auto; }
  .day-modal-header { padding: 1.25rem 1.25rem 0.75rem; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .day-modal-title { font-family: var(--serif); font-size: 18px; color: var(--text); }
  .day-modal-close { background: none; border: none; font-size: 18px; color: var(--muted); cursor: pointer; padding: 2px 6px; }
  .day-modal-body { padding: 1rem 1.25rem; }
  .day-modal-section { margin-bottom: 1rem; }
  .day-modal-section:last-child { margin-bottom: 0; }
  .day-modal-author-label { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 10px; display: inline-block; margin-bottom: 0.5rem; }
  .day-modal-author-label.dasol { background: var(--red-light); color: var(--red); }
  .day-modal-author-label.jimmy { background: var(--mint-light); color: var(--mint); }
  .day-modal-text { font-size: 14px; color: var(--text); line-height: 1.8; white-space: pre-wrap; word-break: break-all; }
  .day-modal-empty { font-size: 13px; color: var(--muted); font-style: italic; }
  .day-modal-emoji { font-size: 20px; margin-bottom: 4px; }
  .day-modal-divider { height: 0.5px; background: var(--border); margin: 1rem 0; }
  .day-modal-action { display: flex; gap: 8px; margin-top: 0.75rem; }
  .day-modal-edit-btn { font-family: var(--sans); font-size: 12px; height: 34px; padding: 0 14px; border-radius: 8px; border: 0.5px solid var(--border); background: none; color: var(--muted); cursor: pointer; }
  .day-modal-edit-btn:hover { background: var(--surface2); }
  .day-modal-write-btn { font-family: var(--sans); font-size: 12px; height: 34px; padding: 0 14px; border-radius: 8px; border: none; background: var(--red); color: #fff; cursor: pointer; }
  .day-modal-write-btn.jimmy { background: var(--mint); }
  .entry-list { margin-bottom: 1.5rem; }
  .no-entries { text-align: center; font-size: 12px; color: var(--muted); padding: 1.25rem 0; }
  .loading { text-align: center; font-size: 12px; color: var(--muted); padding: 1rem 0; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(42,36,32,0.45); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 360px; max-height: 88vh; overflow-y: auto; }
  .modal-title { font-family: var(--serif); font-size: 18px; margin-bottom: 0.2rem; }
  .modal-date-label { font-size: 12px; color: var(--muted); margin-bottom: 1rem; }
  .modal-section { margin-bottom: 1rem; }
  .modal-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 5px; max-height: 140px; overflow-y: auto; padding: 4px 2px; }
  .emoji-btn { width: 38px; height: 38px; border: 0.5px solid var(--border); border-radius: 10px; background: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .emoji-btn:hover { background: var(--surface2); }
  .emoji-btn.active { background: var(--red-light); border-color: var(--red); }
  .emoji-btn.none-btn { font-size: 11px; color: var(--muted); width: auto; padding: 0 10px; }
  textarea { width: 100%; font-family: var(--sans); font-size: 14px; padding: 10px 12px; border: 0.5px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); resize: none; outline: none; transition: border-color 0.2s; line-height: 1.6; }
  textarea:focus { border-color: var(--red); }
  .modal-author-badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 20px; margin-bottom: 0.75rem; }
  .modal-author-badge.dasol { background: var(--red-light); color: var(--red); }
  .modal-author-badge.jimmy { background: var(--mint-light); color: var(--mint); }
  .modal-btn-row { display: flex; gap: 8px; margin-top: 1rem; }
  .btn-cancel { flex: 1; font-family: var(--sans); font-size: 13px; height: 40px; border: 0.5px solid var(--border); border-radius: 10px; background: none; color: var(--muted); cursor: pointer; }
  .btn-cancel:hover { background: var(--surface2); }
  .btn-save { flex: 2; font-family: var(--sans); font-size: 13px; font-weight: 500; height: 40px; border: none; border-radius: 10px; background: var(--red); color: #fff; cursor: pointer; }
  .btn-save.jimmy-save { background: var(--mint); }
  .btn-save:hover { opacity: 0.88; }
  .btn-delete { font-family: var(--sans); font-size: 12px; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; text-align: center; display: block; width: 100%; margin-top: 0.6rem; }
  .read-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(42,36,32,0.45); z-index: 110; align-items: center; justify-content: center; padding: 1rem; }
  .read-modal-overlay.open { display: flex; }
  .read-modal { background: var(--surface); border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 360px; max-height: 88vh; overflow-y: auto; }
  .read-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .read-modal-title { font-family: var(--serif); font-size: 18px; color: var(--text); }
  .read-modal-close { background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer; line-height: 1; padding: 2px 6px; }
  .read-modal-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
  .read-modal-badge { font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 20px; }
  .read-modal-badge.dasol { background: var(--red-light); color: var(--red); }
  .read-modal-badge.jimmy { background: var(--mint-light); color: var(--mint); }
  .read-modal-emoji { font-size: 22px; }
  .read-modal-text { font-size: 14px; color: var(--text); line-height: 1.8; white-space: pre-wrap; word-break: break-all; }
  .reaction-bar { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .reaction-btn { font-size: 12px; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 20px; padding: 2px 6px; cursor: default; line-height: 1.4; }
  .reaction-btn.my-reaction { background: var(--red-light); border-color: var(--red); }
  .reaction-picker { display: none; position: absolute; background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 8px; z-index: 50; flex-wrap: wrap; gap: 3px; width: 220px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); bottom: 32px; left: 0; }
  .reaction-picker.open { display: flex; }
  .reaction-pick-btn { font-size: 16px; background: none; border: none; cursor: pointer; padding: 2px 3px; border-radius: 6px; }
  .reaction-pick-btn:hover { background: var(--surface2); }
  .add-reaction-btn { font-size: 11px; color: var(--muted); background: var(--surface2); border: 0.5px solid var(--border); border-radius: 20px; padding: 2px 8px; cursor: pointer; }
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; font-size: 13px; padding: 0.6rem 1.25rem; border-radius: 20px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">

  <!-- 프로필 선택 화면 -->
  <div class="profile-screen" id="profile-screen">
    <div class="profile-title">Our Time</div>
    <div class="profile-sub">누구로 입장할까요?</div>
    <div class="profile-cards">
      <div class="profile-card" id="card-dasol" onclick="selectProfile('Dasol')">
        <div class="profile-avatar dasol">D</div>
        <div class="profile-name">Dasol</div>
      </div>
      <div class="profile-card" id="card-jimmy" onclick="selectProfile('Jimmy')">
        <div class="profile-avatar jimmy">J</div>
        <div class="profile-name">Jimmy</div>
      </div>
    </div>
    <div class="pin-section" id="pin-section">
      <div class="profile-pin-wrap">
        <div class="profile-pin-label" id="pin-label">비밀번호 입력</div>
        <div class="pin-dots" id="pin-dots">
          <div class="pin-dot" id="pd0"></div>
          <div class="pin-dot" id="pd1"></div>
          <div class="pin-dot" id="pd2"></div>
          <div class="pin-dot" id="pd3"></div>
        </div>
        <div class="pin-error" id="pin-error"></div>
        <div class="pin-pad">
          <button class="pin-key" onclick="pinInput('1')">1</button>
          <button class="pin-key" onclick="pinInput('2')">2</button>
          <button class="pin-key" onclick="pinInput('3')">3</button>
          <button class="pin-key" onclick="pinInput('4')">4</button>
          <button class="pin-key" onclick="pinInput('5')">5</button>
          <button class="pin-key" onclick="pinInput('6')">6</button>
          <button class="pin-key" onclick="pinInput('7')">7</button>
          <button class="pin-key" onclick="pinInput('8')">8</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
  import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyADhK7dI7pIaz40Z6ttjUn_Cp7R5fsRmSU",
    authDomain: "i-like-jimmy.firebaseapp.com",
    projectId: "i-like-jimmy",
    storageBucket: "i-like-jimmy.firebasestorage.app",
    messagingSenderId: "906121789551",
    appId: "1:906121789551:web:152d769884507a78618d9a"
  });
  const db = getFirestore(app);


  // ── 날씨 (Open-Meteo 무료 API) ──
  async function loadWeather() {
    try {
      // 서울: 37.5665, 126.9780 / 인천: 37.4563, 126.7052
      const [seoulRes, incheonRes] = await Promise.all([
        fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,weather_code,uv_index&timezone=Asia%2FSeoul'),
        fetch('https://api.open-meteo.com/v1/forecast?latitude=37.4563&longitude=126.7052&current=temperature_2m,weather_code,uv_index&timezone=Asia%2FSeoul')
      ]);
      const [seoul, incheon] = await Promise.all([seoulRes.json(), incheonRes.json()]);

      function wxIcon(code) {
        if(code===0) return '☀️';
        if(code<=2) return '⛅';
        if(code<=3) return '☁️';
        if(code<=49) return '🌫️';
        if(code<=59) return '🌦️';
        if(code<=69) return '🌧️';
        if(code<=79) return '❄️';
        if(code<=82) return '🌧️';
        if(code<=99) return '⛈️';
        return '🌡️';
      }
      function uvClass(uv) {
        if(uv<3) return 'low';
        if(uv<6) return 'moderate';
        if(uv<8) return 'high';
        return 'very-high';
      }
      function uvLabel(uv) {
        if(uv<3) return '낮음';
        if(uv<6) return '보통';
        if(uv<8) return '높음';
        return '매우높음';
      }
      function sunscreenComment(uv) {
        if(uv<3) return '🌿 오늘은 자외선 걱정 없어요!';
        if(uv<6) return '🧴 선크림 챙기면 좋을 것 같아요~';
        if(uv<8) return '☀️ 선크림 필수! 2시간마다 덧발라줘요';
        return '🔥 선크림 필수!! 외출 전 꼭 발라요!';
      }

      const sTemp = Math.round(seoul.current.temperature_2m);
      const sUV = Math.round(seoul.current.uv_index * 10) / 10;
      const iTemp = Math.round(incheon.current.temperature_2m);
      const iUV = Math.round(incheon.current.uv_index * 10) / 10;
      const maxUV = Math.max(sUV, iUV);

      document.getElementById('w-icon-seoul').textContent = wxIcon(seoul.current.weather_code);
      document.getElementById('w-temp-seoul').textContent = sTemp + '°C';
      const sUVEl = document.getElementById('w-uv-seoul');
      sUVEl.textContent = 'UV ' + sUV + ' ' + uvLabel(sUV);
      sUVEl.className = 'weather-uv ' + uvClass(sUV);

      document.getElementById('w-icon-incheon').textContent = wxIcon(incheon.current.weather_code);
      document.getElementById('w-temp-incheon').textContent = iTemp + '°C';
      const iUVEl = document.getElementById('w-uv-incheon');
      iUVEl.textContent = 'UV ' + iUV + ' ' + uvLabel(iUV);
      iUVEl.className = 'weather-uv ' + uvClass(iUV);

      document.getElementById('w-comment').textContent = sunscreenComment(maxUV);
      document.getElementById('weather-loading').style.display = 'none';
      document.getElementById('weather-content').style.display = 'block';
    } catch(e) {
      document.getElementById('weather-loading').textContent = '날씨를 불러올 수 없어요';
    }
  }

  const START_DATE = '2026-01-16';
  const EMOJIS = [
    '🥰','😍','💕','💗','💓','🫶','❤️','🩷','💏','😘',
    '😊','🥳','😂','😭','🥹','😌','🤩','😴','🥵','😅',
    '☀️','🌤️','🌧️','⛈️','❄️','🌙','⭐','🍃','🔥','🏔️',
    '🏃','🧘‍♀️','🏋️','💻','📖','💄','💰','🎵','🎬','🎁',
    '🍽️','☕','🍵','🍺','🍷','🍰','🍜','🍣','🥂','🍔',
    '🚗','🏖️','🌸','🍀','🎉','🛍️','🏠','🌿','😇','✨'
  ];
  const DAYS_KO = ['일','월','화','수','목','금','토'];
  // 비밀번호 설정 (4자리)
  const PINS = { Dasol: '0419', Jimmy: '0328' };

  let calYear = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let cachedEntries = {};
  let currentDateKey = null;
  let currentAuthor = null;
  let selectedEmoji = null;
  let loggedInUser = null;

  // ── PIN ──
  let pinTarget = null;
  let pinValue = '';

  window.selectProfile = function(name) {
    pinTarget = name;
    pinValue = '';
    updatePinDots();
    document.getElementById('pin-label').textContent = name + '의 비밀번호 입력';
    document.getElementById('pin-error').textContent = '';
    document.querySelectorAll('.pin-dot').forEach(d => {
      d.className = 'pin-dot';
    });
    document.getElementById('pin-section').classList.add('visible');
  }

  window.pinInput = function(n) {
    if(pinValue.length >= 4) return;
    pinValue += n;
    updatePinDots();
    if(pinValue.length === 4) {
      setTimeout(() => checkPin(), 150);
    }
  }

  window.pinDelete = function() {
    pinValue = pinValue.slice(0,-1);
    updatePinDots();
  }

  window.pinCancel = function() {
    pinValue = '';
    pinTarget = null;
    document.getElementById('pin-section').classList.remove('visible');
    document.getElementById('pin-error').textContent = '';
  }

  function updatePinDots() {
    for(let i=0;i<4;i++){
      const dot = document.getElementById('pd'+i);
      dot.className = 'pin-dot' + (i < pinValue.length ? ' filled '+(pinTarget||'dasol').toLowerCase() : '');
    }
  }

  function checkPin() {
    if(pinValue === PINS[pinTarget]) {
      loggedInUser = pinTarget;
      sessionStorage.setItem('ourtime_user', pinTarget);
      enterApp();
    } else {
      document.getElementById('pin-error').textContent = '비밀번호가 틀렸어요';
      pinValue = '';
      updatePinDots();
    }
  }

  window.logout = function() {
    loggedInUser = null;
    sessionStorage.removeItem('ourtime_user');
    document.getElementById('main-screen').classList.remove('visible');
    document.getElementById('profile-screen').style.display = 'flex';
    document.getElementById('pin-section').classList.remove('visible');
    pinValue = ''; pinTarget = null;
  }

  function enterApp() {
    document.getElementById('profile-screen').style.display = 'none';
    document.getElementById('main-screen').classList.add('visible');
    // 프로필 바 설정
    const avatar = document.getElementById('bar-avatar');
    avatar.textContent = loggedInUser[0];
    avatar.className = 'profile-bar-avatar ' + loggedInUser.toLowerCase();
    document.getElementById('bar-name').textContent = loggedInUser;
    updateDisplay();
    loadWeather();
    document.getElementById('entry-list').innerHTML = '<div class="loading">불러오는 중...</div>';
    loadEntries().then(renderCalendar);
  }

  // ── 세션 복원 ──
  const savedUser = sessionStorage.getItem('ourtime_user');
  if(savedUser && (savedUser === 'Dasol' || savedUser === 'Jimmy')) {
    loggedInUser = savedUser;
    enterApp();
  }

  // ── 토스트 ──
  function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

  // ── D+day ──
  function updateDisplay(){
    const s=new Date(START_DATE);s.setHours(0,0,0,0);
    const now=new Date();now.setHours(0,0,0,0);
    const days=Math.floor((now-s)/86400000);
    const orig=new Date(START_DATE),t=new Date();
    let y=t.getFullYear()-orig.getFullYear(),m=t.getMonth()-orig.getMonth(),d=t.getDate()-orig.getDate();
    if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate();}
    if(m<0){y--;m+=12;}
    const ms=[100,200,300,365,500,600,700,730,1000,1100,1200,1300,1460,1500,2000,2500,3000];
    let next={ms:3650,left:3650-days};
    for(const v of ms){if(v>days){next={ms:v,left:v-days};break;}}
    document.getElementById('dday').textContent=days.toLocaleString();
    document.getElementById('today-label').textContent=t.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
    document.getElementById('years').textContent=y;
    document.getElementById('months').textContent=m;
    document.getElementById('days-rem').textContent=d;
    document.getElementById('next-milestone').textContent='D+'+next.ms.toLocaleString()+'까지 '+next.left+'일';
  }

  function dateKey(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
  function entryKey(dk,author){return dk+'_'+author;}
  function getDow(dateStr){return DAYS_KO[new Date(dateStr).getDay()]+'요일';}

  async function loadEntries(){
    cachedEntries={};
    const snap=await getDocs(collection(db,'entries'));
    snap.forEach(d=>{
      const id=d.id, data=d.data();
      if(!id.includes('_')){
        const newKey=id+'_'+(data.author||'Dasol');
        if(!cachedEntries[newKey]) cachedEntries[newKey]=data;
      } else {
        cachedEntries[id]=data;
      }
    });
  }

  function getDateEntries(dk){
    return {
      Dasol: cachedEntries[entryKey(dk,'Dasol')]||null,
      Jimmy: cachedEntries[entryKey(dk,'Jimmy')]||null
    };
  }

  function renderCalendar(){
    const today=new Date();
    const firstDay=new Date(calYear,calMonth,1).getDay();
    const dim=new Date(calYear,calMonth+1,0).getDate();
    const grid=document.getElementById('cal-grid');
    document.getElementById('cal-title').textContent=calYear+'년 '+(calMonth+1)+'월';
    grid.innerHTML='';
    DAYS_KO.forEach(d=>{const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.appendChild(el);});
    for(let i=0;i<firstDay;i++){const el=document.createElement('div');el.className='cal-day empty';grid.appendChild(el);}
    for(let d=1;d<=dim;d++){
      const dk=dateKey(calYear,calMonth,d);
      const {Dasol:de,Jimmy:je}=getDateEntries(dk);
      const hasAny=!!(de||je);
      const isToday=today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d;
      const el=document.createElement('div');
      el.className='cal-day'+(hasAny?' has-date':'')+(isToday?' today':'');
      let indicators='';
      if(de) indicators+=(de.emoji?'<span class="cal-emoji">'+de.emoji+'</span>':'<span class="cal-dot"></span>');
      if(je) indicators+=(je.emoji?'<span class="cal-emoji">'+je.emoji+'</span>':'<span class="cal-dot mint"></span>');
      el.innerHTML='<span>'+d+'</span><div class="cal-indicators">'+indicators+'</div>';
      el.onclick=()=>openDayView(calYear,calMonth,d);
      grid.appendChild(el);
    }
    renderEntryList();
  }

  function renderEntryList(){
    const list=document.getElementById('entry-list');
    const prefix=calYear+'-'+String(calMonth+1).padStart(2,'0');
    const monthLabel=calYear+'년 '+( calMonth+1)+'월';
    const dayKeys=[...new Set(
      Object.keys(cachedEntries).filter(k=>k.startsWith(prefix)).map(k=>k.split('_')[0])
    )].sort().reverse();
    if(dayKeys.length===0){list.innerHTML='<div class="no-entries">'+monthLabel+' 데이트 기록이 없어요</div>';return;}
    list.innerHTML=dayKeys.map(dk=>{
      const {Dasol:de,Jimmy:je}=getDateEntries(dk);
      const[,m,d]=dk.split('-');
      const dow=getDow(dk);
      // 본인 기록만 클릭 가능
      const dasolClickable = loggedInUser==='Dasol';
      const jimmyClickable = loggedInUser==='Jimmy';
      const dasolReadable = loggedInUser==='Jimmy' && !!de;
      const jimmyReadable = loggedInUser==='Dasol' && !!je;
      const dasolHtml=`<div class="author-entry${dasolClickable?' clickable':(dasolReadable?' clickable':'')}" data-dk="${dk}" data-author="Dasol" data-mode="${dasolClickable?'edit':(dasolReadable?'read':'')}">
        <div class="author-entry-top">
          <span class="author-name dasol">Dasol ${de?.emoji||''}</span>
          ${dasolClickable?'<span style="font-size:11px;color:var(--muted);">'+(de?'수정':'+ 쓰기')+'</span>':''}
          ${dasolReadable?'<span style="font-size:11px;color:var(--muted);">자세히 보기</span>':''}
        </div>
        ${de?.text?`<div class="author-entry-text">${de.text.substring(0,80)}${de.text.length>80?'...':''}</div>`:'<div class="author-entry-empty">아직 기록이 없어요</div>'}
        ${(de?.reactions&&Object.keys(de.reactions).length)?`<div class="reaction-bar">${(()=>{const g={};Object.values(de.reactions).forEach(e=>{g[e]=(g[e]||0)+1;});return Object.entries(g).map(([e,c])=>`<span class="reaction-btn">${e} ${c}</span>`).join('');})()}</div>`:''}
      </div>`;
      const jimmyHtml=`<div class="author-entry${jimmyClickable?' clickable':(jimmyReadable?' clickable':'')}" data-dk="${dk}" data-author="Jimmy" data-mode="${jimmyClickable?'edit':(jimmyReadable?'read':'')}">
        <div class="author-entry-top">
          <span class="author-name jimmy">Jimmy ${je?.emoji||''}</span>
          ${jimmyClickable?'<span style="font-size:11px;color:var(--muted);">'+(je?'수정':'+ 쓰기')+'</span>':''}
          ${jimmyReadable?'<span style="font-size:11px;color:var(--muted);">자세히 보기</span>':''}
        </div>
        ${je?.text?`<div class="author-entry-text">${je.text.substring(0,80)}${je.text.length>80?'...':''}</div>`:'<div class="author-entry-empty">아직 기록이 없어요</div>'}
        ${(je?.reactions&&Object.keys(je.reactions).length)?`<div class="reaction-bar">${(()=>{const g={};Object.values(je.reactions).forEach(e=>{g[e]=(g[e]||0)+1;});return Object.entries(g).map(([e,c])=>`<span class="reaction-btn">${e} ${c}</span>`).join('');})()}</div>`:''}
      </div>`;
      return `<div class="day-detail">
        <div class="day-detail-header"><div class="day-detail-date">${parseInt(m)}월 ${parseInt(d)}일 (${dow})</div></div>
        <div class="author-entries">${dasolHtml}${jimmyHtml}</div>
      </div>`;
    }).join('');
    // 본인 기록만 클릭 이벤트
    list.querySelectorAll('.author-entry.clickable').forEach(el=>{
      el.onclick=()=>{
        if(el.dataset.mode==='read') openReadModal(el.dataset.dk, el.dataset.author);
        else openModal(el.dataset.dk, el.dataset.author);
      };
    });
  }

  function openDayView(y,m,d){
    const dk=dateKey(y,m,d);
    openDayModal(dk);
  }

  function openDayModal(dk) {
    const {Dasol:de,Jimmy:je}=getDateEntries(dk);
    const[ky,km,kd]=dk.split('-');
    const dow=getDow(dk);
    // 헤더
    document.getElementById('day-modal-title').textContent=parseInt(km)+'월 '+parseInt(kd)+'일 ('+dow+')';
    // Dasol 섹션
    const dasolSec=document.getElementById('day-modal-dasol');
    dasolSec.innerHTML=`
      ${de?.emoji?`<div class="day-modal-emoji">${de.emoji}</div>`:''}
      ${de?.text?`<div class="day-modal-text">${de.text}</div>`:`<div class="day-modal-empty">아직 기록이 없어요</div>`}
      ${getReactionBar(de?.reactions)}
    `;
    // Jimmy 섹션
    const jimmySec=document.getElementById('day-modal-jimmy');
    jimmySec.innerHTML=`
      ${je?.emoji?`<div class="day-modal-emoji">${je.emoji}</div>`:''}
      ${je?.text?`<div class="day-modal-text">${je.text}</div>`:`<div class="day-modal-empty">아직 기록이 없어요</div>`}
      ${getReactionBar(je?.reactions)}
    `;
    // 내 기록 버튼
    const myEntry = loggedInUser==='Dasol'?de:je;
    const myBtn=document.getElementById('day-modal-my-btn');
    myBtn.textContent=myEntry?'내 기록 수정':'+ 내 기록 쓰기';
    myBtn.className='day-modal-write-btn'+(loggedInUser==='Jimmy'?' jimmy':'');
    myBtn.onclick=()=>{closeDayModal();openModal(dk,loggedInUser);};
    // 상대방 리액션 버튼 (읽기 전용 상대 기록에 리액션)
    const otherAuthor=loggedInUser==='Dasol'?'Jimmy':'Dasol';
    const otherEntry=loggedInUser==='Dasol'?je:de;
    const reactBtn=document.getElementById('day-modal-react-btn');
    if(otherEntry?.text) {
      reactBtn.style.display='inline-flex';
      reactBtn.onclick=()=>{closeDayModal();openReadModal(dk,otherAuthor);};
    } else {
      reactBtn.style.display='none';
    }
    document.getElementById('day-modal').classList.add('open');
  }

  window.closeDayModal=function(){
    document.getElementById('day-modal').classList.remove('open');
  }

  let readModalDk = null;
  let readModalAuthor = null;

  function openReadModal(dk, author) {
    readModalDk = dk; readModalAuthor = author;
    const ek = entryKey(dk, author);
    const entry = cachedEntries[ek]||{};
    const[ky,km,kd] = dk.split('-');
    document.getElementById('read-modal-title').textContent = parseInt(kd)+'일 '+author+'의 기록';
    const badge = document.getElementById('read-modal-badge');
    badge.textContent = author;
    badge.className = 'read-modal-badge '+author.toLowerCase();
    document.getElementById('read-modal-emoji').textContent = entry.emoji||'';
    document.getElementById('read-modal-text').textContent = entry.text||'';
    renderReadReactions(entry.reactions||{});
    buildReactionPicker();
    document.getElementById('read-modal').classList.add('open');
  }

  function renderReadReactions(reactions) {
    const bar = document.getElementById('read-reaction-bar');
    // reactions = {Dasol: '❤️', Jimmy: '🔥'} 구조
    // 같은 이모티콘 그룹핑해서 표시
    const grouped = {};
    Object.entries(reactions).forEach(([user, emoji]) => {
      if(!grouped[emoji]) grouped[emoji] = [];
      grouped[emoji].push(user);
    });
    const myEmoji = reactions[loggedInUser];
    bar.innerHTML = Object.keys(grouped).length
      ? Object.entries(grouped).map(([e, users]) =>
          `<span class="reaction-btn ${users.includes(loggedInUser)?'my-reaction':''}" title="${users.join(', ')}">${e} ${users.length}</span>`
        ).join('')
      : '';
  }

  const REACTION_EMOJIS = ['❤️','🥰','😍','😂','😭','🥹','👍','👎','🔥','💯','🫶','😊','🤩','😴','🥵','☀️','🌧️','🎉','💕','🍺','☕','🍷','💻','🏃','🧘‍♀️','🌿','✨','😇','💰','🎵'];
  function buildReactionPicker() {
    const picker = document.getElementById('reaction-picker');
    picker.innerHTML = REACTION_EMOJIS.map(e=>
      `<button class="reaction-pick-btn" onclick="addReaction('${e}')">${e}</button>`
    ).join('');
  }

  window.toggleReactionPicker = function() {
    document.getElementById('reaction-picker').classList.toggle('open');
  }

  window.addReaction = async function(emoji) {
    if(!readModalDk||!readModalAuthor) return;
    document.getElementById('reaction-picker').classList.remove('open');
    const ek = entryKey(readModalDk, readModalAuthor);
    const entry = cachedEntries[ek]||{};
    // reactions = { Dasol: 'emoji', Jimmy: 'emoji' } 구조
    const reactions = {...(entry.reactions||{})};
    // 같은 이모티콘 다시 누르면 취소, 다른 거 누르면 교체
    if(reactions[loggedInUser] === emoji) {
      delete reactions[loggedInUser];
    } else {
      reactions[loggedInUser] = emoji;
    }
    const updated = {...entry, reactions};
    await setDoc(doc(db,'entries',ek), updated);
    cachedEntries[ek] = updated;
    renderReadReactions(reactions);
    renderCalendar();
  }

  window.closeReadModal = function() {
    document.getElementById('read-modal').classList.remove('open');
  }

  document.getElementById('day-modal').addEventListener('click', e=>{
    if(e.target===document.getElementById('day-modal')) closeDayModal();
  });

  document.getElementById('read-modal').addEventListener('click', e=>{
    if(e.target===document.getElementById('read-modal')) closeReadModal();
  });

  function openModal(dk, author){
    if(author !== loggedInUser) return; // 본인 기록만
    currentDateKey=dk; currentAuthor=author;
    const ek=entryKey(dk,author);
    const entry=cachedEntries[ek]||{};
    const[ky,km,kd]=dk.split('-');
    const dow=getDow(dk);
    document.getElementById('modal-title').textContent=author+'의 기록';
    document.getElementById('modal-date-label').textContent=ky+'년 '+parseInt(km)+'월 '+parseInt(kd)+'일 ('+dow+')';
    document.getElementById('modal-author-badge-wrap').innerHTML=`<span class="modal-author-badge ${author.toLowerCase()}">${author}</span>`;
    document.getElementById('modal-text').value=entry.text||'';
    selectedEmoji=entry.emoji||null;
    renderEmojiGrid(selectedEmoji);
    document.getElementById('btn-delete').style.display=cachedEntries[ek]?'block':'none';
    const saveBtn=document.getElementById('btn-save');
    saveBtn.className='btn-save'+(author==='Jimmy'?' jimmy-save':'');
    document.getElementById('modal').classList.add('open');
  }

  function closeModal(){
    document.getElementById('modal').classList.remove('open');
    currentDateKey=null; currentAuthor=null; selectedEmoji=null;
  }

  function renderEmojiGrid(selected){
    const grid=document.getElementById('emoji-grid');
    grid.innerHTML='';
    const noneBtn=document.createElement('button');
    noneBtn.className='emoji-btn none-btn'+(selected===null?' active':'');
    noneBtn.textContent='없음';
    noneBtn.onclick=()=>{selectedEmoji=null;renderEmojiGrid(null);};
    grid.appendChild(noneBtn);
    EMOJIS.forEach(e=>{
      const btn=document.createElement('button');
      btn.className='emoji-btn'+(selected===e?' active':'');
      btn.textContent=e;
      btn.onclick=()=>{selectedEmoji=e;renderEmojiGrid(e);};
      grid.appendChild(btn);
    });
  }

  async function saveEntry(){
    if(!currentDateKey||!currentAuthor) return;
    const text=document.getElementById('modal-text').value.trim();
    if(!text&&!selectedEmoji){closeModal();return;}
    showToast('저장 중...');
    const ek=entryKey(currentDateKey,currentAuthor);
    const data={text,author:currentAuthor,emoji:selectedEmoji||null};
    await setDoc(doc(db,'entries',ek),data);
    cachedEntries[ek]=data;
    closeModal(); renderCalendar();
    showToast('저장됐어요 ♥');
  }

  async function deleteEntry(){
    if(!currentDateKey||!currentAuthor||!confirm('이 기록을 삭제할까요?')) return;
    showToast('삭제 중...');
    const ek=entryKey(currentDateKey,currentAuthor);
    await deleteDoc(doc(db,'entries',ek));
    delete cachedEntries[ek];
    closeModal(); renderCalendar();
    showToast('삭제됐어요');
  }

  // 스크롤 위로가기
  window.addEventListener('scroll', ()=>{
    const btn = document.getElementById('scroll-top-btn');
    if(btn) btn.classList.toggle('visible', window.scrollY > 300);
  });

  document.getElementById('btn-save').onclick=saveEntry;
  document.getElementById('btn-cancel').onclick=closeModal;
  document.getElementById('btn-delete').onclick=deleteEntry;
  document.getElementById('prev-btn').onclick=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();};
  document.getElementById('next-btn').onclick=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();};
  document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
</script>
</body>
</html>
